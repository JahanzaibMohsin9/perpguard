<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PerpGuard</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --text: #e8eaf0; --muted: #8b93a6; --line: #262a33;
    --accent: #4f8cff; --ok: #2fbf71; --warn: #f5a524; --danger: #f2555a; --btn-text: #fff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-tg]) { --bg: #f4f5f8; --card: #fff; --text: #14161b; --muted: #636b7d; --line: #e3e6ec; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 90px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
  .logo svg { width: 18px; height: 18px; }
  h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .2px; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--card); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: 1px; }
  .dot.live { background: var(--ok); }
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; gap: 12px; }
  .summary .label { color: var(--muted); font-size: 12px; }
  .summary .value { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pos { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .pos.WARNING { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
  .pos.DANGER { border-color: var(--danger); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .coin { font-size: 18px; font-weight: 700; }
  .side { font-size: 13px; font-weight: 600; margin-left: 6px; }
  .side.LONG { color: var(--ok); } .side.SHORT { color: var(--danger); }
  .risk { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .risk.OK { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .risk.WARNING { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .risk.DANGER { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 12px 0; font-variant-numeric: tabular-nums; }
  .grid .label { color: var(--muted); font-size: 12px; }
  .pnl.up { color: var(--ok); } .pnl.down { color: var(--danger); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; }
  .dist { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 11px 10px; cursor: pointer; background: var(--line); color: var(--text); font-weight: 600; }
  button.primary { background: var(--accent); color: var(--btn-text); }
  button.danger { background: var(--danger); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .spectate { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 16px; }
  .spectate h2 { font-size: 14px; margin: 0 0 8px; }
  .spectate .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .inrow { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .empty, .status { text-align: center; color: var(--muted); padding: 28px 10px; }
  .notice { font-size: 13px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet-bg.open { display: flex; }
  .sheet { width: 100%; max-width: 560px; background: var(--card); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 6px; font-size: 18px; }
  .sheet p { margin: 0 0 14px; color: var(--muted); }
  .sheet .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 18px; max-width: 528px; margin: 0 auto; padding: 12px 14px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 600; transform: translateY(150%); transition: transform .25s, visibility .25s; visibility: hidden; z-index: 20; }
  .toast.show { transform: none; visibility: visible; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <h1>PerpGuard</h1>
    <span class="chip" id="net"><span class="dot" id="dot"></span><span id="netText">connecting</span></span>
  </header>

  <div id="notice"></div>
  <div class="summary" id="summary" hidden>
    <div><div class="label" id="who">Account</div><div class="value" id="addr">-</div></div>
    <div style="text-align:right"><div class="label">Equity</div><div class="value" id="equity">-</div></div>
  </div>
  <div id="positions"><div class="status">Connecting...</div></div>

  <section class="spectate">
    <h2>Spectator mode</h2>
    <div class="inrow">
      <input id="watchInput" placeholder="0x... any Hyperliquid testnet address" autocomplete="off" spellcheck="false" />
      <button class="primary" id="watchBtn">Watch</button>
    </div>
    <p class="hint">Read-only. Watch a friend or a public trader. <a href="#" id="mine" hidden style="color:var(--accent)">Back to my account</a></p>
  </section>

  <footer>Testnet demo · protective actions only · never asks for your keys</footer>
</main>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="sheetTitle">Confirm</h3>
    <p id="sheetText"></p>
    <div class="btns">
      <button id="sheetCancel">Cancel</button>
      <button class="primary" id="sheetOk">Confirm</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const LABELS = { close50: 'Close 50%', closeAll: 'Close all', stopBreakEven: 'Stop at break-even', stop2pct: 'Stop 2% away' };
  const DETAIL = {
    close50: (p) => `Reduce-only market order for half the position (${+(p.size / 2).toPrecision(6)} ${p.coin}).`,
    closeAll: (p) => `Reduce-only market order for the whole ${p.size} ${p.coin}.`,
    stopBreakEven: (p) => `Stop-loss at your entry price ${fmt(p.entryPx)}. Only works while in profit.`,
    stop2pct: (p) => `Stop-loss 2% away from the current mark ${fmt(p.markPx)}.`,
  };
  const $ = (id) => document.getElementById(id);

  // ---------- Telegram launch data (read from the URL hash; no external script needed) ----------
  const launch = new URLSearchParams(location.hash.slice(1));
  const initData = launch.get('tgWebAppData') || '';
  try {
    const theme = JSON.parse(launch.get('tgWebAppThemeParams') || 'null');
    if (theme) {
      document.documentElement.dataset.tg = '1';
      const map = { bg_color: '--bg', secondary_bg_color: '--card', text_color: '--text', hint_color: '--muted', button_color: '--accent', button_text_color: '--btn-text' };
      for (const [k, v] of Object.entries(map)) if (theme[k]) document.documentElement.style.setProperty(v, theme[k]);
      if (theme.section_separator_color) document.documentElement.style.setProperty('--line', theme.section_separator_color);
    }
  } catch {}
  function tgEvent(eventType, eventData = {}) {
    try {
      if (window.TelegramWebviewProxy) window.TelegramWebviewProxy.postEvent(eventType, JSON.stringify(eventData));
      else if (window.external && 'notify' in window.external) window.external.notify(JSON.stringify({ eventType, eventData }));
      else if (window.parent !== window) window.parent.postMessage(JSON.stringify({ eventType, eventData }), '*');
    } catch {}
  }
  tgEvent('web_app_ready'); tgEvent('web_app_expand');
  const haptic = (type) => tgEvent('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: type });

  // ---------- state ----------
  let ws, session = { authed: false, user: null, master: null }, snap = null, pending = null, reconnectMs = 1000;
  const watched = () => snap && snap.address;

  function fmt(n, d) {
    if (n === null || n === undefined || !isFinite(n)) return '-';
    const digits = d ?? (n >= 1000 ? 0 : n >= 1 ? 2 : 4);
    return n.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  const short = (a) => a ? `${a.slice(0, 6)}…${a.slice(-4)}` : '-';
  const risk = (d) => d === null ? 'OK' : d < 3 ? 'DANGER' : d < 8 ? 'WARNING' : 'OK';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function toast(text, ok) {
    const t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3800);
    if (ok !== undefined) haptic(ok ? 'success' : 'error');
  }

  // ---------- render ----------
  function render() {
    $('notice').innerHTML = '';
    if (!session.authed) {
      $('notice').innerHTML = `<div class="notice">${initData ? 'Read-only: this Telegram account is not linked to PerpGuard.' : 'Read-only: open from the PerpGuard bot in Telegram to protect your account.'}</div>`;
    }
    $('mine').hidden = !(session.master && watched() && watched().toLowerCase() !== session.master.toLowerCase());
    if (!snap) return;
    $('summary').hidden = false;
    $('who').textContent = snap.canTrade ? `Your account${session.user ? ' · ' + session.user : ''}` : 'Watching (read-only)';
    $('addr').textContent = short(snap.address);
    $('equity').textContent = `${fmt(snap.accountValue, 2)} USDC`;
    const box = $('positions');
    if (!snap.positions.length) { box.innerHTML = '<div class="empty">No open positions.</div>'; return; }
    box.innerHTML = snap.positions.map((p) => {
      const r = risk(p.liqDistancePct);
      const d = p.liqDistancePct;
      const width = d === null ? 100 : Math.max(3, Math.min(100, (d / 20) * 100));
      const color = r === 'DANGER' ? 'var(--danger)' : r === 'WARNING' ? 'var(--warn)' : 'var(--ok)';
      const actions = snap.canTrade
        ? `<div class="actions">${Object.keys(LABELS).map((k) => `<button data-a="${k}" data-c="${esc(p.coin)}" ${pending ? 'disabled' : ''}>${LABELS[k]}</button>`).join('')}</div>`
        : '';
      return `<div class="pos ${r}">
        <div class="row"><div><span class="coin">${esc(p.coin)}</span><span class="side ${p.side}">${p.side} ${p.leverage}x</span></div><span class="risk ${r}">${r}</span></div>
        <div class="grid">
          <div><div class="label">PnL</div><div class="pnl ${p.unrealizedPnl >= 0 ? 'up' : 'down'}">${p.unrealizedPnl >= 0 ? '+' : ''}${fmt(p.unrealizedPnl, 2)} USDC</div></div>
          <div><div class="label">Size</div><div>${p.size} ${esc(p.coin)}</div></div>
          <div><div class="label">Mark</div><div>${fmt(p.markPx)}</div></div>
          <div><div class="label">Liquidation</div><div>${fmt(p.liqPx)}</div></div>
        </div>
        <div class="bar"><i style="width:${width}%;background:${color}"></i></div>
        <div class="dist">${d === null ? 'No liquidation price' : d >= 100 ? 'More than 99% from liquidation' : `${fmt(d, 1)}% from liquidation`}</div>
        ${actions}
      </div>`;
    }).join('');
  }

  // ---------- confirm sheet ----------
  let sheetAction = null;
  $('positions').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b || !snap) return;
    const p = snap.positions.find((x) => x.coin === b.dataset.c);
    if (!p) return;
    sheetAction = { action: b.dataset.a, coin: p.coin, at: Date.now() };
    $('sheetTitle').textContent = `${LABELS[b.dataset.a]} · ${p.coin} ${p.side} ${p.leverage}x`;
    $('sheetText').textContent = `${DETAIL[b.dataset.a](p)} Testnet, reduce-only.`;
    $('sheetBg').classList.add('open');
    tgEvent('web_app_trigger_haptic_feedback', { type: 'impact', impact_style: 'light' });
  });
  const closeSheet = () => { $('sheetBg').classList.remove('open'); sheetAction = null; };
  $('sheetCancel').onclick = closeSheet;
  $('sheetBg').addEventListener('click', (e) => { if (e.target === $('sheetBg')) closeSheet(); });
  $('sheetOk').onclick = () => {
    if (!sheetAction || Date.now() - sheetAction.at > 30000) { closeSheet(); return toast('Confirmation expired. Nothing was sent.'); }
    const requestId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    pending = requestId;
    send({ type: 'action', requestId, action: sheetAction.action, coin: sheetAction.coin });
    toast(`${LABELS[sheetAction.action]} ${sheetAction.coin}: sending...`);
    closeSheet(); render();
    setTimeout(() => { if (pending === requestId) { pending = null; render(); toast('No reply. Check the position before retrying.', false); } }, 20000);
  };

  // ---------- spectator ----------
  $('watchBtn').onclick = () => {
    const a = $('watchInput').value.trim();
    if (!/^0x[0-9a-fA-F]{40}$/.test(a)) return toast('Enter a valid 0x address (42 characters).');
    snap = null; $('positions').innerHTML = '<div class="status">Loading...</div>';
    send({ type: 'watch', address: a });
  };
  $('mine').onclick = (e) => { e.preventDefault(); if (session.master) { snap = null; send({ type: 'watch', address: session.master }); } };

  // ---------- connection ----------
  function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
  function setLive(on, text) { $('dot').classList.toggle('live', on); $('netText').textContent = text; }
  function connect() {
    ws = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws');
    ws.onopen = () => { reconnectMs = 1000; setLive(true, 'live'); if (initData) send({ type: 'auth', initData }); };
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'session') { session = m; render(); }
      else if (m.type === 'snapshot') { snap = m; setLive(true, `${m.network} · live`); render(); }
      else if (m.type === 'actionResult') { if (m.requestId === pending) { pending = null; toast(m.message, m.ok); render(); } }
      else if (m.type === 'status' && !snap) { $('positions').innerHTML = `<div class="status">${esc(m.message)}</div>`; }
    };
    ws.onclose = () => { setLive(false, 'reconnecting'); setTimeout(connect, reconnectMs); reconnectMs = Math.min(reconnectMs * 2, 15000); };
  }
  connect();
})();
</script>
</body>
</html>
